version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
      - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
      - VITE_FIREBASE_DATABASE_URL=${VITE_FIREBASE_DATABASE_URL}
      - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
      - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
      - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
      - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
      - VITE_WEATHER_API_KEY=${VITE_WEATHER_API_KEY}
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./packages:/app/packages

  firebase-emulator:
    image: firebase/tools:latest
    ports:
      - "9000:9000"
      - "5000:5000"
    environment:
      - FIREBASE_PROJECT_ID=solar-mon-dev
    command: emulators:start --only firestore,hosting --project solar-mon-dev
